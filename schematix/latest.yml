releaseNotes: |-
  - Import réel des sauvegardes natives D-Link DGS-1100 V2 (.cfg) : déblocage du sélecteur sans firmware obligatoire, décodage automatique des ports (Access/Trunk, PVID, VLANs autorisés, noms), des VLANs nommés et de l’IP de gestion tout en gardant la sauvegarde pour Restore.
  - Import complet des sauvegardes pare-feu FortiGate (.conf) : prise en charge des politiques multi-services, groupes de services, NAT, fsso, infos d’interfaces/VLANs et analyse automatique dès la sélection du fichier.
